name: "Terraform Automation"

on:
  push:
    branches:
      - main  # जब भी आप main branch में कोड push करेंगी, ये अपने आप चलेगा
  pull_request:

jobs:
  terraform:
    name: "Terraform Job"
    runs-on: ubuntu-latest
    
    # Ye line add karein:
    defaults:
      run:
        working-directory: CodeSamples/Terraform/terraform-state-04-04-2026

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      # ... baki ke env variables ...

    env:
      # Azure के Credentials जो आपने Secrets में डाले थे
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      # 1. GitHub से आपका कोड 'Runner' मशीन पर लाना
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Terraform को Runner मशीन पर Setup करना
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      # 3. Terraform Initialize करना (Plugins download करना)
      - name: Terraform Init
        run: terraform init

      # 4. Terraform Plan (दिखाएगा कि क्या-क्या बनेगा)
      - name: Terraform Plan
        run: terraform plan

      # 5. Terraform Apply (Infrastructure असलियत में बना देगा)
      # 'auto-approve' ताकि ये बिना इंसानी दखल के काम पूरा करे
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
